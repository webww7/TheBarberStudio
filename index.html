<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Barber Studio | Barbearia</title>
  <meta name="description" content="Barbearia moderna com estilo. Confira nossa tabela de preços e agende seu horário." />

  <link rel="icon" type="image/png" href="logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --amarelo: #FFD400;
      --amarelo-escuro: #E6BE00;
      --preto: #0A0A0A;
      --preto-suave: #141414;
      --branco: #F5F5F5;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--preto);
      color: var(--branco);
      overflow-x: hidden;
      line-height: 1.6;
    }

    h1, h2, h3, .logo-texto, .btn, .nav-link { font-family: 'Bebas Neue', sans-serif; letter-spacing: 2px; }
    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; display: block; }

    /* ===== ANIMAÇÕES DE ROLAGEM ===== */
    .reveal, .reveal-esquerda, .reveal-direita, .reveal-zoom {
      opacity: 0;
      transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform;
    }
    .reveal { transform: translateY(60px); }
    .reveal-esquerda { transform: translateX(-80px); }
    .reveal-direita { transform: translateX(80px); }
    .reveal-zoom { transform: scale(0.85); }

    .reveal.ativo, .reveal-esquerda.ativo,
    .reveal-direita.ativo, .reveal-zoom.ativo {
      opacity: 1;
      transform: translate(0, 0) scale(1);
    }

    .delay-1 { transition-delay: 0.15s; }
    .delay-2 { transition-delay: 0.3s; }
    .delay-3 { transition-delay: 0.45s; }
    .delay-4 { transition-delay: 0.6s; }
    .delay-5 { transition-delay: 0.75s; }

    /* ===== HEADER ===== */
    header {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      z-index: 1000;
      padding: 14px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.4s ease, padding 0.4s ease, box-shadow 0.4s ease;
      background: transparent;
    }

    header.rolado {
      background: rgba(10, 10, 10, 0.95);
      padding: 8px 5%;
      box-shadow: 0 2px 30px rgba(255, 212, 0, 0.08);
      backdrop-filter: blur(10px);
    }

    .logo { display: flex; align-items: center; gap: 10px; }
    .logo img { width: 52px; height: 52px; object-fit: contain; transition: transform 0.4s ease; }
    .logo:hover img { transform: rotate(-8deg) scale(1.08); }

    .logo-texto {
      font-size: 1.5rem;
      color: var(--branco);
      letter-spacing: 2px;
      line-height: 1;
    }
    .logo-texto span { color: var(--amarelo); }

    nav { display: flex; gap: 28px; align-items: center; }

    .nav-link {
      font-size: 1.05rem;
      color: var(--branco);
      position: relative;
      padding-bottom: 4px;
      transition: color 0.3s ease;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 0; height: 2px;
      background: var(--amarelo);
      transition: width 0.35s ease;
    }
    .nav-link:hover { color: var(--amarelo); }
    .nav-link:hover::after { width: 100%; }

    .btn {
      display: inline-block;
      padding: 12px 30px;
      background: var(--amarelo);
      color: var(--preto);
      font-size: 1.1rem;
      border: 2px solid var(--amarelo);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.35s ease;
    }
    .btn:hover {
      background: transparent;
      color: var(--amarelo);
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(255, 212, 0, 0.25);
    }
    .btn-preenchido { background: var(--amarelo); color: var(--preto); }
    .btn-preenchido:hover { background: var(--amarelo-escuro); color: var(--preto); border-color: var(--amarelo-escuro); }

    .menu-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
    }
    .menu-toggle span {
      width: 28px; height: 3px;
      background: var(--amarelo);
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    /* ===== HERO ===== */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 120px 5% 80px;
      background: linear-gradient(135deg, #0A0A0A 0%, #1A1A1A 50%, #0A0A0A 100%);
    }
    .hero::before, .hero::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .hero::before {
      top: -50%; right: -20%;
      width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(255, 212, 0, 0.08) 0%, transparent 70%);
      animation: flutuar 8s ease-in-out infinite;
    }
    .hero::after {
      bottom: -30%; left: -10%;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(255, 212, 0, 0.05) 0%, transparent 70%);
      animation: flutuar 10s ease-in-out infinite reverse;
    }
    @keyframes flutuar {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -30px) scale(1.1); }
    }

    .hero-conteudo { position: relative; z-index: 2; text-align: center; max-width: 850px; }

    .hero-logo {
      width: 160px; height: 160px;
      object-fit: contain;
      margin: 0 auto 20px;
      filter: drop-shadow(0 0 40px rgba(255, 212, 0, 0.3));
      animation: flutuarLogo 6s ease-in-out infinite;
    }
    @keyframes flutuarLogo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .hero h1 {
      font-size: clamp(3.2rem, 9vw, 6.5rem);
      line-height: 1;
      margin-bottom: 20px;
      text-shadow: 0 0 60px rgba(255, 212, 0, 0.15);
    }
    .hero h1 .destaque { color: var(--amarelo); display: inline-block; position: relative; }
    .hero h1 .destaque::after {
      content: '';
      position: absolute;
      bottom: 5px; left: 0;
      width: 100%; height: 6px;
      background: var(--amarelo);
      opacity: 0.3;
      border-radius: 3px;
    }

    .hero p {
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: #B0B0B0;
      max-width: 600px;
      margin: 0 auto 40px;
      font-weight: 300;
    }

    .hero-botoes { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }

    .btn-contorno { background: transparent; color: var(--amarelo); border: 2px solid var(--amarelo); }
    .btn-contorno:hover { background: var(--amarelo); color: var(--preto); }

    .scroll-indicador {
      position: absolute;
      bottom: 35px; left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #666;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: pulsarBaixo 2s ease-in-out infinite;
    }
    .scroll-indicador .linha {
      width: 2px; height: 40px;
      background: linear-gradient(to bottom, var(--amarelo), transparent);
    }
    @keyframes pulsarBaixo {
      0%, 100% { opacity: 0.4; transform: translateX(-50%) translateY(0); }
      50% { opacity: 1; transform: translateX(-50%) translateY(8px); }
    }

    /* ===== SEÇÕES ===== */
    section { padding: 100px 5%; position: relative; }

    .secao-titulo { text-align: center; margin-bottom: 60px; }
    .secao-titulo h2 { font-size: clamp(2.2rem, 5vw, 3.5rem); color: var(--branco); margin-bottom: 12px; }
    .secao-titulo h2 span { color: var(--amarelo); }
    .secao-titulo .linha-decorativa { width: 70px; height: 4px; background: var(--amarelo); margin: 0 auto; border-radius: 2px; }
    .secao-titulo p { color: #888; margin-top: 16px; font-size: 1.05rem; font-weight: 300; }

    /* ===== SERVIÇOS ===== */
    .servicos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .servico-card {
      background: var(--preto-suave);
      border: 1px solid #222;
      border-radius: 12px;
      padding: 40px 30px;
      text-align: center;
      transition: all 0.45s ease;
      position: relative;
      overflow: hidden;
    }
    .servico-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 4px;
      background: var(--amarelo);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.45s ease;
    }
    .servico-card:hover {
      transform: translateY(-10px);
      border-color: rgba(255, 212, 0, 0.3);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(255, 212, 0, 0.06);
    }
    .servico-card:hover::before { transform: scaleX(1); }

    .servico-icone { font-size: 2.8rem; margin-bottom: 18px; display: block; }
    .servico-card h3 { font-size: 1.6rem; color: var(--amarelo); margin-bottom: 12px; }
    .servico-card p { color: #999; font-size: 0.95rem; margin-bottom: 18px; font-weight: 300; }
    .servico-preco { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: var(--branco); letter-spacing: 1px; }

    /* ===== TABELA DE PREÇOS ===== */
    .tabela-precos {
      background: var(--preto-suave);
      position: relative;
      overflow: hidden;
    }

    .tabela-precos::before {
      content: '';
      position: absolute;
      top: -100px; right: -100px;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(255, 212, 0, 0.06) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .tabela-precos::after {
      content: '';
      position: absolute;
      bottom: -100px; left: -100px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(255, 212, 0, 0.04) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .tabela-wrapper {
      max-width: 620px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 60px rgba(255, 212, 0, 0.08);
      border: 1px solid rgba(255, 212, 0, 0.15);
      transition: transform 0.5s ease, box-shadow 0.5s ease;
    }

    .tabela-wrapper:hover {
      transform: translateY(-6px);
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8), 0 0 80px rgba(255, 212, 0, 0.15);
    }

    .tabela-wrapper img { width: 100%; height: auto; display: block; }

    .tabela-cta {
      text-align: center;
      margin-top: 45px;
      position: relative;
      z-index: 1;
    }

    .tabela-cta p {
      color: #999;
      font-weight: 300;
      margin-bottom: 22px;
      font-size: 1.05rem;
    }

    /* ===== EQUIPE ===== */
    .equipe { position: relative; overflow: hidden; }
    .equipe::before {
      content: '';
      position: absolute;
      top: -100px; left: -100px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(255, 212, 0, 0.05) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .equipe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 35px;
      max-width: 1100px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .barbeiro-card {
      background: var(--preto-suave);
      border: 1px solid #1F1F1F;
      border-radius: 14px;
      overflow: hidden;
      transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
    }
    .barbeiro-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 4px;
      background: var(--amarelo);
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.5s ease;
      z-index: 3;
    }
    .barbeiro-card:hover {
      transform: translateY(-12px);
      border-color: rgba(255, 212, 0, 0.35);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 50px rgba(255, 212, 0, 0.08);
    }
    .barbeiro-card:hover::before { transform: scaleX(1); }

    .barbeiro-foto {
      width: 100%;
      aspect-ratio: 3/4;
      overflow: hidden;
      position: relative;
      background: #111;
    }
    .barbeiro-foto img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center top;
      transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1), filter 0.5s ease;
      filter: grayscale(15%) brightness(0.95);
    }
    .barbeiro-card:hover .barbeiro-foto img {
      transform: scale(1.07);
      filter: grayscale(0%) brightness(1.05);
    }
    .barbeiro-foto::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10, 10, 10, 0.95) 0%, rgba(10, 10, 10, 0.3) 40%, transparent 70%);
      z-index: 1;
    }

    .barbeiro-info {
      position: relative;
      z-index: 2;
      padding: 0 26px 30px;
      margin-top: -60px;
      text-align: center;
    }

    .barbeiro-nome-link {
      display: inline-block;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem;
      color: var(--branco);
      letter-spacing: 3px;
      margin-bottom: 6px;
      line-height: 1.1;
      transition: color 0.35s ease, transform 0.35s ease;
      position: relative;
    }
    .barbeiro-nome-link::after {
      content: '';
      position: absolute;
      bottom: -2px; left: 50%;
      width: 0; height: 3px;
      background: var(--amarelo);
      transition: all 0.4s ease;
      transform: translateX(-50%);
      border-radius: 2px;
    }
    .barbeiro-nome-link:hover { color: var(--amarelo); transform: translateY(-2px); }
    .barbeiro-nome-link:hover::after { width: 80%; }

    .barbeiro-cargo {
      font-size: 0.8rem;
      color: var(--amarelo);
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 22px;
      display: block;
    }

    .barbeiro-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      background: transparent;
      color: var(--amarelo);
      border: 2px solid var(--amarelo);
      border-radius: 6px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 2px;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .barbeiro-link span.txt { position: relative; z-index: 2; }
    .barbeiro-link .seta { position: relative; z-index: 2; transition: transform 0.4s ease; font-size: 1.2rem; }
    .barbeiro-link::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: var(--amarelo);
      transition: left 0.4s ease;
      z-index: 1;
    }
    .barbeiro-link:hover {
      color: var(--preto);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(255, 212, 0, 0.3);
    }
    .barbeiro-link:hover::before { left: 0; }
    .barbeiro-link:hover .seta { transform: translateX(6px); }

    /* ===== SOBRE ===== */
    .sobre-conteudo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
    }
    .sobre-texto h2 { font-size: clamp(2rem, 4vw, 3rem); margin-bottom: 20px; line-height: 1.1; }
    .sobre-texto h2 span { color: var(--amarelo); }
    .sobre-texto p { color: #AAA; margin-bottom: 18px; font-weight: 300; font-size: 1rem; }

    .sobre-destaques { display: flex; gap: 30px; margin-top: 30px; flex-wrap: wrap; }
    .sobre-destaque-item { text-align: center; }
    .sobre-destaque-item .numero {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.5rem;
      color: var(--amarelo);
      line-height: 1;
    }
    .sobre-destaque-item .rotulo {
      font-size: 0.8rem;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .sobre-imagem {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 4/5;
      background: linear-gradient(135deg, #1A1A1A, #0A0A0A);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sobre-imagem img {
      width: 80%; height: 80%;
      object-fit: contain;
      opacity: 0.95;
    }
    .sobre-imagem::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 2px solid rgba(255, 212, 0, 0.15);
      border-radius: 12px;
      pointer-events: none;
    }

    /* ===== GALERIA ===== */
    .galeria-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .galeria-item {
      aspect-ratio: 3/4;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      background: #111;
      cursor: pointer;
      transition: all 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      border: 1px solid #1F1F1F;
    }
    .galeria-item img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1), filter 0.5s ease;
      filter: grayscale(20%) brightness(0.92);
    }
    .galeria-item:hover {
      transform: translateY(-8px);
      border-color: rgba(255, 212, 0, 0.4);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(255, 212, 0, 0.1);
    }
    .galeria-item:hover img {
      transform: scale(1.08);
      filter: grayscale(0%) brightness(1.05);
    }
    .galeria-item::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(255, 212, 0, 0.2), transparent 55%);
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }
    .galeria-item:hover::after { opacity: 1; }

    .galeria-legenda {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%;
      padding: 20px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
      color: var(--amarelo);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 2px;
      transform: translateY(100%);
      transition: transform 0.45s ease;
      z-index: 2;
    }
    .galeria-item:hover .galeria-legenda { transform: translateY(0); }

    /* ===== DEPOIMENTOS ===== */
    .depoimentos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .depoimento-card {
      background: var(--preto-suave);
      border: 1px solid #1F1F1F;
      border-radius: 12px;
      padding: 35px 30px;
      transition: all 0.4s ease;
      position: relative;
    }
    .depoimento-card::before {
      content: '"';
      font-family: 'Bebas Neue', sans-serif;
      font-size: 5rem;
      color: var(--amarelo);
      opacity: 0.15;
      position: absolute;
      top: 10px; left: 20px;
      line-height: 1;
    }
    .depoimento-card:hover {
      border-color: rgba(255, 212, 0, 0.2);
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .depoimento-estrelas { color: var(--amarelo); margin-bottom: 16px; font-size: 1rem; letter-spacing: 3px; }
    .depoimento-texto { color: #BBB; font-style: italic; margin-bottom: 22px; font-weight: 300; position: relative; z-index: 1; }
    .depoimento-autor { display: flex; align-items: center; gap: 14px; }
    .depoimento-avatar {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--amarelo), var(--amarelo-escuro));
      display: flex; align-items: center; justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      color: var(--preto);
      flex-shrink: 0;
    }
    .depoimento-nome { font-weight: 600; font-size: 0.95rem; color: var(--branco); }
    .depoimento-cargo { font-size: 0.8rem; color: #666; }

    /* ===== CTA AGENDAMENTO ===== */
    .cta-agendamento {
      background: linear-gradient(135deg, #111 0%, #0A0A0A 100%);
      border-top: 1px solid rgba(255, 212, 0, 0.1);
      border-bottom: 1px solid rgba(255, 212, 0, 0.1);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .cta-agendamento::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(255, 212, 0, 0.06) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .cta-agendamento h2 {
